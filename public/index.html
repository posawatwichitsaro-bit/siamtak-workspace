<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Siamtak Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">S</div>
        <div>
          <div class="brand-name">Siamtak</div>
          <div class="brand-sub">Workspace</div>
        </div>
      </div>
      <nav>
        <button class="nav-item active" data-route="hub"><span>⌂</span> Hub</button>
        <button class="nav-item" data-route="accpress"><span>▣</span> Auto Accpress</button>
        <button class="nav-item" data-route="history"><span>◷</span> ประวัติการทำงาน</button>
        <button class="nav-item" data-route="settings"><span>⚙</span> ระบบ</button>
      </nav>
      <div class="sidebar-bottom">
        <a class="ai-card" id="aiLink" href="#" target="_blank" rel="noreferrer">
          <span class="ai-dot"></span>
          <div><strong>Siamtak AI</strong><small>เปิด AI ภายในบริษัท</small></div>
          <span>↗</span>
        </a>
        <div class="admin-box">
          <small>ต้องการความช่วยเหลือ?</small>
          <strong>ติดต่อ Admin</strong>
          <span>IT / System Administrator</span>
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="hamburger" id="hamburger" aria-label="เมนู">☰</button>
        <div class="crumb" id="crumb">Hub</div>
        <div class="top-actions">
          <span class="status-pill"><i></i> Internal Network</span>
          <div class="avatar">ST</div>
        </div>
      </header>
      <main id="content"></main>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
